[project]
name = "typeanvil-harness"
version = "0.1.0"
description = "WPT print-reftest conformance harness for Typeanvil (HTML/CSS -> PDF)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "pypdfium2>=4.25",
    "Pillow>=10.0",
]

[project.scripts]
typeanvil-harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
