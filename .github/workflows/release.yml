# Release CI (CORE-135): tag → cross-platform binaries → GitHub Releases.
# CORE-136 adds the npm-publish job: wrapper + platform packages, versions
# stamped from the tag.
#
# Trigger: push of a tag `v*`. Version is CalVer (YYYY.M.PATCH — plain month;
# zero-padded month is not npm-semver-valid), decided on CORE-133; the tag is
# the single source of truth — engine/Cargo.toml is
# stamped from the tag at build time and never hand-edited.
#
# DETERMINISM (do not change without reading docs/specifications/release-ci.spec.md):
# The repo's [profile.release] in engine/Cargo.toml pins `lto = "thin"` and
# relies on rustc defaults (no fast-math, no reassociation, IEEE-754 semantics
# preserved; FMA contraction forbidden at call sites). This workflow must NOT
# add RUSTFLAGS that alter float semantics (e.g. -C target-feature=+fma,
# -C float-fast-math) or override LTO.
#
# DECIDED 2026-09-03: hand-rolled build matrix (not cargo-dist) — see the
# spec's Decision section for rationale.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  derive-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Derive CalVer version from tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # CalVer: YYYY.M.PATCH — year, plain (non-zero-padded) month, patch.
          # Zero-padding (2026.09.0) is NOT npm-semver-valid: node-semver
          # rejects leading zeros. Plain month (2026.9.0) sorts fine for
          # CalVer because the year+month ordering matches lexicographic
          # order within a year, and cross-year ordering is dominated by
          # the year itself.
          if ! echo "$version" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::Tag $TAG is not CalVer (expected vYYYY.M.PATCH, e.g. v2026.9.0)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: derive-version
    runs-on: ${{ matrix.runs-on }}
    # Re-runnability: a failed target must not block the others (Behavior 8).
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
          # Intel macs: cross-compiled on an Apple Silicon runner (macos-13
          # Intel runners are pool-starved and queue indefinitely).
          - target: x86_64-apple-darwin
            runs-on: macos-14
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64-linux cross-compile via zig as the linker/cross toolchain
      # (cargo-zigbuild). No QEMU run needed: we only build, not run tests.
      # zig is downloaded directly (pinned 0.13.0 — supported by
      # cargo-zigbuild 0.23) instead of via setup-zig/pipx: both proved
      # flaky in bring-up (mirror 404/502s; wheel console script not found).
      - name: Install zig 0.13.0 (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p "$HOME/.zig"
          tar -xJf /tmp/zig.tar.xz --strip-components=1 -C "$HOME/.zig"
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild (aarch64-linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: pipx install cargo-zigbuild && echo "/opt/pipx_bin" >> "$GITHUB_PATH"

      - name: Stamp engine version from tag
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          cd engine
          # Rewrite [package].version from the tag (Behavior 3). The pattern
          # matches exactly one line in Cargo.toml (verified: only the
          # package version is anchored at line start).
          sed -i.bak -E 's/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          rm Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Build (release)
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          cd engine
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            # pipx bin dir is not on PATH for GH Actions steps (rc files are
            # never sourced); add it explicitly.
            export PATH="/opt/pipx_bin:$HOME/.local/pipx/venvs/cargo-zigbuild/bin:$HOME/.local/bin:$PATH"
            cargo zigbuild --release --target aarch64-unknown-linux-gnu
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Verify --version matches tag
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          BIN="engine/target/${{ matrix.target }}/release/typeanvil"
          # Cross-compiled ARM64 Linux binaries cannot execute on the x86_64
          # runner directly; run them under qemu-user-static with the arm64
          # glibc sysroot (Behavior 7 still verified by real execution).
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross > /dev/null
            ACTUAL=$(qemu-aarch64-static -L /usr/aarch64-linux-gnu "$BIN" --version)
          else
            ACTUAL=$("$BIN" --version)
          fi
          EXPECTED="typeanvil $VERSION"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::--version mismatch: got '$ACTUAL', expected '$EXPECTED'"
            exit 1
          fi
          echo "version check ok: $ACTUAL"

      - name: Package artifact
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          STAGING="typeanvil-$VERSION-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "engine/target/${{ matrix.target }}/release/typeanvil" "$STAGING/"
          cp scripts/release-README.md "$STAGING/README.md"
          tar -czf "$STAGING.tar.gz" "$STAGING"
          echo "ARTIFACT=$STAGING.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.derive-version.outputs.version }}-${{ matrix.target }}
          path: typeanvil-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [derive-version, build]
    runs-on: ubuntu-22.04
    steps:
      # gh resolves the repo from git remote state; the release job touches
      # no other repo content but must be inside a checkout for gh to work.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          cd dist
          # Hash only this release's tarballs (Behavior 6).
          sha256sum typeanvil-"$VERSION"-*.tar.gz > SHA256SUMS

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if missing, then upload (idempotent re-runs).
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

  # npm distribution (CORE-136): publish the wrapper + platform packages with
  # the binaries from this same tag. Versions are stamped from the tag —
  # no hand-edited versions anywhere (npm spec, Behavior 3).
  #
  # The npm registry is public and a publish is irreversible, so NPM_TOKEN is
  # OPTIONAL: when it is absent the publish steps skip with a notice and the
  # job stays green (npm spec, Behavior 7). A tag therefore always produces
  # GitHub Release binaries, whether or not npm publishing is configured yet.
  npm-publish:
    needs: [derive-version, build]
    runs-on: ubuntu-22.04
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check npm credentials
        id: creds
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set — skipping npm publish (binaries-only release)."
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Unpack binaries and stamp versions from tag
        env:
          VERSION: ${{ needs.derive-version.outputs.version }}
        run: |
          set -euo pipefail
          # Release artifact → npm platform package mapping (npm spec: Package layout).
          declare -A PKG=(
            ["aarch64-apple-darwin"]="typeanvil-darwin-arm64"
            ["x86_64-apple-darwin"]="typeanvil-darwin-x64"
            ["x86_64-unknown-linux-gnu"]="typeanvil-linux-x64-gnu"
            ["x86_64-unknown-linux-musl"]="typeanvil-linux-x64-musl"
            ["aarch64-unknown-linux-gnu"]="typeanvil-linux-arm64-gnu"
          )
          for target in "${!PKG[@]}"; do
            tar -xzf "dist/typeanvil-$VERSION-$target.tar.gz"
            dir="npm/${PKG[$target]}"
            # The platform packages track only package.json: the binary is
            # gitignored, so bin/ does not exist in a fresh checkout.
            # Create it before install, or the publish job fails here.
            mkdir -p "$dir/bin"
            install -m 0755 "typeanvil-$VERSION-$target/typeanvil" "$dir/bin/typeanvil"
          done
          # Stamp version = tag in every package.json (Behavior 3), plus the
          # wrapper's optionalDependencies pins so the resolved set matches.
          for pj in npm/*/package.json; do
            node -e '
              const fs = require("fs");
              const f = process.argv[1], v = process.argv[2];
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              pkg.version = v;
              if (pkg.optionalDependencies) {
                for (const d of Object.keys(pkg.optionalDependencies)) {
                  pkg.optionalDependencies[d] = v;
                }
              }
              fs.writeFileSync(f, JSON.stringify(pkg, null, 2) + "\n");
            ' "$pj" "$VERSION"
          done

      # Platform packages first; the wrapper LAST — its optionalDependencies
      # must resolve against the registry at install time.
      - name: Publish platform packages
        if: steps.creds.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/typeanvil-darwin-arm64 npm/typeanvil-darwin-x64 \
                     npm/typeanvil-linux-x64-gnu npm/typeanvil-linux-x64-musl \
                     npm/typeanvil-linux-arm64-gnu; do
            npm publish --access public "$dir"
          done

      - name: Publish wrapper package
        if: steps.creds.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public npm/typeanvil
