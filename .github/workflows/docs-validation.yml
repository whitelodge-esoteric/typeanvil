# Docs frontmatter validation — runs the same check as the pre-commit hook.
# Activates when the repo has a GitHub remote and this workflow is pushed.
#
# This workflow has no `paths:` filter on purpose. `validate` is a required
# status check for `release/**` and `main`. A required check that a path filter
# skips never reports, and GitHub then blocks the pull request forever. The job
# shall run on every push and every pull request.
name: docs-validation

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run docs validation (pre-commit all-files)
        run: pre-commit run --all-files
