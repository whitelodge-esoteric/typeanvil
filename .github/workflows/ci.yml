# CI: engine clippy + tests, harness tests (CORE-474).
# `scripts/ci-local.sh` runs the same steps with the same flags.
# Runbook: docs/operations/ci.md
name: ci

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      # Toolchain matches docker/Dockerfile.dev (rust:1.97).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # GitHub runners have no macOS Arial. The engine falls back to the
      # bundled Liberation Sans set at this path (same as docker/Dockerfile).
      - name: Install bundled fonts
        working-directory: .
        run: |
          sudo mkdir -p /usr/share/fonts/typeanvil
          sudo cp docker/fonts/typeanvil/* /usr/share/fonts/typeanvil/
      # Ratchet: engine/Cargo.toml allows every lint that fires today, so
      # -D warnings fails only on a NEW warning. See docs/operations/ci.md.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --no-fail-fast

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install harness
        run: uv sync --python 3.12
      - name: Pytest
        run: uv run pytest tests -q
