[package]
name = "typeanvil"
version = "0.0.1"
edition = "2021"
description = "Typeanvil — HTML/CSS to PDF typesetting engine (walking skeleton)"
license = "AGPL-3.0-only"

[[bin]]
name = "typeanvil"
path = "src/main.rs"

[dependencies]
html5ever = "0.39"
markup5ever_rcdom = "0.39"
# CSS engine (Servo stylo). `dom` is the stylo_dom companion crate.
stylo = { version = "0.20", default-features = false, features = ["servo"] }
# Runtime pref table for stylo's servo-gated longhands (CORE-63): enables
# `layout.columns.enabled` before any cascade.
static_prefs = { package = "stylo_static_prefs", version = "0.20" }
dom = { package = "stylo_dom", version = "0.20" }
selectors = "0.40"
servo_arc = "0.4"
app_units = "0.7"
euclid = "0.22"
style_traits = { package = "stylo_traits", version = "0.20", features = ["servo"] }
stylo_atoms = "0.20"
parking_lot = "0.12"
rustc-hash = "2"
string_cache = "0.9"
web_atoms = "0.2"
# Required by stylo's servo feature (explicit per CORE-56 ground truth).
url = "2.5"
mime = "0.3"
# Transition: the hand-rolled cascade still parses with cssparser until the
# stylo path replaces it (CORE-56). Removed once css.rs is fully stylo.
cssparser = "0.35"
# Complete-rule CSS parsing for the @media seam (CORE-156). Renamed so it
# can coexist with the 0.35 used by the color helpers above; stylo itself
# uses 0.37, so this does not add a second graph node.
cssparser_037 = { package = "cssparser", version = "0.37" }
# PDF output (Typst's production backend).
krilla = "0.8"
# Text shaping (HarfBuzz port, pure Rust) — main-text glyph advances.
harfrust = "0.13"
read-fonts = "0.43"
# Knuth-Liang hyphenation patterns (zero-alloc, pure Rust, data-only).
hypher = "0.1"
# System font discovery + css-fonts-4 matching (CORE-103). Pure Rust
# (ttf-parser under the hood); loads once per process (~430ms, 1285 faces).
fontdb = "0.23"
# UAX #14 line-break opportunities (pure Rust). Deviation from the spec's
# icu_segmenter: see typography.rs `line_break_opportunities` for rationale.
unicode-linebreak = "0.1"
# SVG rasterization bridge (CORE-131): usvg parse + tiny-skia raster, pure
# Rust. The engine rasterizes SVG to PNG at a fixed deterministic scale and
# embeds the raster via krilla (see images.rs).
resvg = "0.45"
# GIF decoding (CORE-186): decode the FIRST frame to RGBA and re-encode as PNG
# at intern time, so the rest of the pipeline (krilla) sees a format it embeds.
# Same normalise-at-intern shape as the SVG bridge above. Pure Rust; the LZW
# work is `weezl`. Animated GIFs print their first frame, matching Chromium's
# static-medium behaviour.
gif = "0.13"
# Errors.
anyhow = "1"

[profile.release]
# Deterministic: no fast-math / reassociation. IEEE-754 semantics preserved by
# default in rustc; we additionally forbid FMA contraction at call sites.
lto = "thin"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
